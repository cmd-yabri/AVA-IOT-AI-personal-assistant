{% load static %} <!-- load the static tag for static files -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /> <!-- UTF-8 encoding -->
  <meta name="viewport" content="width=device-width,initial-scale=1" /> <!-- responsive page -->
  <title>Sign In / Sign Up</title> <!-- sign-in/sign-up page title -->

  <!-- FontAwesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- extra Google icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <!-- page stylesheet -->
  <link rel="stylesheet" href="{% static 'voiceapp/css/signin.css' %}?v=10">

</head>
<body>
  <div class="container"> <!-- main container -->

    <div class="logo-container"> <!-- logo -->
      <img src="{% static 'voiceapp/images/ava.png' %}" alt="Logo" class="logo" />
    </div>

    <!-- holds both forms (login + signup) -->
    <!-- if the URL contains signup → add the signup-active class -->
    <div class="forms {% if '/signup' in request.path %}signup-active{% endif %}" id="forms-container">

      <!-- sign-in form -->
      <form id="signin-form" method="post" action="{% url 'signin' %}">
        {% csrf_token %} <!-- CSRF protection -->
        <h2>Sign In</h2>

        <!-- username field -->
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" name="username" placeholder="Username" required />
        </div>

        <!-- password field with show/hide button -->
        <div class="input-group password-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="signin-password" name="password" placeholder="Password" required />
          <button type="button" class="toggle-password" data-target="#signin-password" aria-label="Show password">
            <span class="material-symbols-rounded">visibility</span>
          </button>
        </div>

        <!-- submit button -->
        <button class="btn" type="submit">Sign In</button>
        <!-- link to switch to sign-up -->
        <p class="toggle-text">
          Don’t have an account?
          <a class="inline-link" href="{% url 'signup' %}" id="show-signup">Sign Up</a>
        </p>
      </form>

      <!-- sign-up form -->
      <form id="signup-form" method="post" action="{% url 'signup' %}">
        {% csrf_token %}
        <h2>Sign Up</h2>

        <!-- username -->
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" name="username" placeholder="Username" required />
        </div>

        <!-- email (optional) -->
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" placeholder="Email (optional)" />
        </div>

        <!-- password with show/hide button -->
        <div class="input-group password-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="signup-password" name="password" placeholder="Password" required />
          <button type="button" class="toggle-password" data-target="#signup-password" aria-label="Show password">
            <span class="material-symbols-rounded">visibility</span>
          </button>
        </div>

        <!-- submit button -->
        <button class="btn" type="submit">Sign Up</button>
        <!-- link to switch to sign-in -->
        <p class="toggle-text">
          Already have an account?
          <a class="inline-link" href="{% url 'signin' %}" id="show-signin">Sign In</a>
        </p>
      </form>

    </div>
  </div>

  <!-- error messages from Django -->
  {% if messages %}
    <ul class="messages">
      {% for m in messages %}<li>{{ m }}</li>{% endfor %}
    </ul>
  {% endif %}

  <!-- script for showing/hiding the password -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // hide the default reveal button in some browsers (Edge/IE)
      try {
        const style = document.createElement('style');
        style.textContent = 'input[type="password"]::-ms-reveal, input[type="password"]::-ms-clear { display: none; }';
        document.head.appendChild(style);
      } catch(e){}

      // toggle password visibility
      document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', () => {
          const sel = btn.getAttribute('data-target');
          const input = document.querySelector(sel);
          if (!input) return;

          const isHidden = input.type === 'password';
          input.type = isHidden ? 'text' : 'password';

          const icon = btn.querySelector('.material-symbols-rounded');
          if (icon) icon.textContent = isHidden ? 'visibility_off' : 'visibility';
        });
      });
    });
  </script>

  <!-- additional JavaScript file -->
  <script src="{% static 'voiceapp/js/signin.js' %}"></script>
</body>
</html>
